name: business-intelligence-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: bi-platform-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: bi_user
      POSTGRES_PASSWORD: bi_password
      POSTGRES_DB: bi_platform

    ports:
      - "5432:5432"

    volumes:
      - bi_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bi_user -d bi_platform
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb:
    image: mongo:7
    container_name: bi-platform-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - bi_mongodb_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: bi-platform-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - bi_redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  bi_postgres_data:
  bi_mongodb_data:
  bi_redis_data: